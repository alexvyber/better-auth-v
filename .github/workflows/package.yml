name: Package installation

on:
  push:
    branches: [main]
    tags: ['0.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libsqlite3-dev libpq-dev
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl@3 sqlite libpq
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Install checksum-pinned V 0.5.2 release
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64)
              archive=v_linux.zip
              checksum=86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23
              ;;
            macOS/ARM64)
              archive=v_macos_arm64.zip
              checksum=e539a8dc3aeea47267f3cf00c25c4f0a364d8037fb13f5379d2a574a7abac8ee
              ;;
            macOS/X64)
              archive=v_macos_x86_64.zip
              checksum=de19ef02874aec502f091b75e504e4836da38f627ddf7f7f9ecf6e8cf262f9d0
              ;;
            *) echo "Unsupported runner: $RUNNER_OS/$RUNNER_ARCH"; exit 1 ;;
          esac
          curl --fail --location --retry 3 "https://github.com/vlang/v/releases/download/0.5.2/$archive" -o "$RUNNER_TEMP/v.zip"
          echo "$checksum  $RUNNER_TEMP/v.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/v.zip" -d "$RUNNER_TEMP/v-release"
          "$RUNNER_TEMP/v-release/v/v" version
          echo "$RUNNER_TEMP/v-release/v" >> "$GITHUB_PATH"
      - name: Check installed package consumers
        run: make check-package
